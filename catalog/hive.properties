# ============================================
# HIVE CONNECTOR - Read raw CSV/Parquet files
# ============================================
connector.name=hive

# Sử dụng file-based metastore (không cần Hive Metastore server)
hive.metastore=file
hive.metastore.catalog.dir=s3://tn3/hive-metastore

# ============================================
# S3 FILE SYSTEM - Native S3 Configuration
# ============================================

# Enable native S3 filesystem
fs.native-s3.enabled=true

# Địa chỉ endpoint của MinIO  
s3.endpoint=http://192.168.100.17:9000

# Thông tin xác thực
s3.aws-access-key=admin
s3.aws-secret-key=12345678

# Path-style access cho MinIO
s3.path-style-access=true

# Region
s3.region=us-east-1

# ============================================
# HIVE CONFIGURATION
# ============================================

# Allow creating external tables
hive.non-managed-table-writes-enabled=true
hive.non-managed-table-creates-enabled=true

# Format defaults
hive.storage-format=CSV
