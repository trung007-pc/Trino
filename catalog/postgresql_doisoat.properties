# ============================================
# POSTGRESQL CONNECTOR - Database Đối Soát
# Kết nối đến PostgreSQL database riêng cho đối soát
# ============================================
connector.name=postgresql

# Kết nối đến PostgreSQL database đối soát
connection-url=jdbc:postgresql://192.168.100.16:5432/sandbox_UploadXml3176Service_New
connection-user=postgres
connection-password=12345678

# ============================================
# CASE SENSITIVITY CONFIGURATION
# ============================================

# Cho phép Trino match table/column names case-insensitive
# Giải quyết vấn đề với PostgreSQL tables có chữ hoa (ApiRequests)
case-insensitive-name-matching=true

# ============================================
# PERFORMANCE CONFIGURATION
# ============================================

# Cho phép pushdown operations để tối ưu query
postgresql.experimental.enable-string-pushdown-with-collate=true
