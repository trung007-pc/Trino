# ============================================
# CONNECTOR CONFIGURATION
# ============================================
connector.name=iceberg

# Catalog type (Sử dụng JDBC để quản lý metadata)
iceberg.catalog.type=jdbc

# JDBC Catalog URL - Kết nối PostgreSQL trong Docker network
# Dùng tên service 'postgres' thay vì 'localhost'
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/iceberg_db
iceberg.jdbc-catalog.connection-user=admin
iceberg.jdbc-catalog.connection-password=password

# [BẮT BUỘC] Catalog name
iceberg.jdbc-catalog.catalog-name=iceberg

# Warehouse location - Nơi lưu trữ data files (Parquet/Avro) trên MinIO
iceberg.jdbc-catalog.default-warehouse-dir=s3://kcb-xml-files/warehouse

# ============================================
# S3 FILE SYSTEM - Native S3 support (MinIO)
# ============================================

# Kích hoạt hệ thống file S3 native
fs.native-s3.enabled=true

# Địa chỉ endpoint của MinIO
s3.endpoint=http://192.168.100.17:9000

# Thông tin xác thực (Credentials)
s3.aws-access-key=admin
s3.aws-secret-key=12345678

# Bắt buộc cho MinIO: Sử dụng Path-style access
s3.path-style-access=true

# Cấu hình vùng (Region)
s3.region=us-east-1

# ============================================
# PERFORMANCE & CACHING CONFIGURATION
# ============================================

# TẮT metadata cache để tránh stale snapshot khi test
# Mỗi query sẽ đọc metadata mới nhất từ PostgreSQL
iceberg.metadata-cache.enabled=false